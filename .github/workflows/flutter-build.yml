name: Flutter Build

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/flutter-build.yml'
  pull_request:
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/flutter-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --org com.hackathon --project-name identity_wallet .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: identity-wallet-apk
          path: frontend/mobile/build/app/outputs/flutter-apk/app-release.apk
