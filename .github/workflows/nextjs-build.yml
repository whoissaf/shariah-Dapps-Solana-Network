name: Next.js Build

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/web/**'
      - '.github/workflows/nextjs-build.yml'
  pull_request:
    paths:
      - 'frontend/web/**'
      - '.github/workflows/nextjs-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: verifier-web-static
          path: frontend/web/out
